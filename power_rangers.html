<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SPD MORPH ENGINE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial, Helvetica, sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:5%;
    width:100%;
    text-align:center;
    z-index:20;
    pointer-events:none;
}

h1{
    color:white;
    font-size:4rem;
    letter-spacing:10px;
    font-weight:900;

    text-shadow:
        0 0 20px #fff,
        0 0 40px #00aaff,
        0 0 80px #00aaff;
}

#mode{
    margin-top:15px;
    color:#00d9ff;
    font-size:1.2rem;
    letter-spacing:5px;
    text-transform:uppercase;

    text-shadow:
        0 0 10px #00d9ff;
}

#video-container{
    position:absolute;
    bottom:2%;
    left:18%;
    transform:translateX(-50%) scaleX(-1);

    width:85vw;
    max-width:420px;
    height:42vh;

    border-radius:25px;
    overflow:hidden;

    border:2px solid rgba(255,255,255,0.15);

    z-index:30;

    background:black;

    box-shadow:
        0 0 50px rgba(0,150,255,0.4);
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0.8;
}

#output_canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    z-index:100;
    transition:0.15s;
}

#grid{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;

    background:
        linear-gradient(rgba(0,180,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,180,255,0.08) 1px, transparent 1px);

    background-size:40px 40px;
}

</style>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

</head>

<body>

<div id="grid"></div>
<div id="flash"></div>

<div id="ui">
    <h1>S.P.D</h1>
    <div id="mode">SPECIAL POLICE DEKARANGER</div>
</div>

<div id="video-container">
    <video class="input_video"></video>
    <canvas id="output_canvas"></canvas>
</div>

<script type="module">

import * as THREE from 'three';

import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';


// ---------------- SCENE ----------------

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.z = 55;

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    alpha:true
});

renderer.setSize(window.innerWidth,window.innerHeight);

renderer.setPixelRatio(Math.min(devicePixelRatio,2));

document.body.appendChild(renderer.domElement);


// ---------------- POST FX ----------------

const composer = new EffectComposer(renderer);

composer.addPass(new RenderPass(scene,camera));

const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(innerWidth,innerHeight),
    2,
    0.4,
    0.85
);

composer.addPass(bloomPass);


// ---------------- PARTICLES ----------------

const COUNT = 28000;

const geometry = new THREE.BufferGeometry();

const positions = new Float32Array(COUNT * 3);
const colors = new Float32Array(COUNT * 3);
const sizes = new Float32Array(COUNT);

const targetPos = new Float32Array(COUNT * 3);
const targetCol = new Float32Array(COUNT * 3);
const targetSize = new Float32Array(COUNT);

geometry.setAttribute(
    'position',
    new THREE.BufferAttribute(positions,3)
);

geometry.setAttribute(
    'color',
    new THREE.BufferAttribute(colors,3)
);

geometry.setAttribute(
    'size',
    new THREE.BufferAttribute(sizes,1)
);


// ---------------- SHADER ----------------

const particleMaterial = new THREE.ShaderMaterial({

    transparent:true,

    depthWrite:false,

    blending:THREE.AdditiveBlending,

    vertexColors:true,

    uniforms:{
        time:{ value:0 }
    },

    vertexShader:`

        attribute float size;

        varying vec3 vColor;

        uniform float time;

        void main(){

            vColor = color;

            vec3 p = position;

            p.x += sin(time + position.y * 0.04) * 0.6;

            p.y += cos(time + position.x * 0.04) * 0.6;

            vec4 mvPosition =
                modelViewMatrix *
                vec4(p,1.0);

            gl_PointSize =
                size *
                (280.0 / -mvPosition.z);

            gl_Position =
                projectionMatrix *
                mvPosition;
        }

    `,

    fragmentShader:`

        varying vec3 vColor;

        void main(){

            float d =
                distance(gl_PointCoord, vec2(0.5));

            if(d > 0.5) discard;

            float strength =
                1.0 -
                smoothstep(0.0,0.5,d);

            gl_FragColor =
                vec4(vColor, strength);
        }

    `
});

const particles = new THREE.Points(
    geometry,
    particleMaterial
);

scene.add(particles);


// ---------------- STATES ----------------

let currentMode = "idle";

function setTargets(type){

    currentMode = type;

    const flash = document.getElementById("flash");

    flash.style.opacity = "1";

    setTimeout(()=>{
        flash.style.opacity = "0";
    },120);

    const modeText =
        document.getElementById("mode");

    for(let i=0;i<COUNT;i++){

        let x,y,z,r,g,b,s;

        if(type === "red"){

            const angle = i * 0.03;

            const radius = 8 + i * 0.0015;

            x = Math.cos(angle) * radius;
            y = Math.sin(angle) * radius;
            z = (Math.random()-0.5) * 20;

            r = 1;
            g = 0.1;
            b = 0.1;

            s = 2.5;

            bloomPass.strength = 3;

            modeText.innerText =
                "SPD RED RANGER";

            modeText.style.color =
                "#ff3333";
        }

        else if(type === "blue"){

            const radius =
                30 + Math.random()*50;

            const theta =
                Math.random()*Math.PI*2;

            const phi =
                Math.acos(2*Math.random()-1);

            x =
                radius *
                Math.sin(phi) *
                Math.cos(theta);

            y =
                radius *
                Math.sin(phi) *
                Math.sin(theta);

            z =
                radius *
                Math.cos(phi);

            r = 0.1;
            g = 0.5;
            b = 1;

            s = 1.5;

            bloomPass.strength = 2.5;

            modeText.innerText =
                "SPD BLUE RANGER";

            modeText.style.color =
                "#00aaff";
        }

        else if(type === "shadow"){

            const t =
                Math.random()*Math.PI*2;

            const rad =
                Math.random()*25;

            x = rad*Math.cos(t);
            y = rad*Math.sin(t);
            z = (Math.random()-0.5)*40;

            r = 0.5;
            g = 0.5;
            b = 0.5;

            s = 2;

            bloomPass.strength = 4;

            modeText.innerText =
                "SPD SHADOW RANGER";

            modeText.style.color =
                "#ffffff";
        }

        else if(type === "mega"){

            x = (Math.random()-0.5)*100;
            y = (Math.random()-0.5)*100;
            z = (Math.random()-0.5)*100;

            r = 0;
            g = 1;
            b = 1;

            s = 3;

            bloomPass.strength = 5;

            modeText.innerText =
                "MEGA MODE ACTIVATED";

            modeText.style.color =
                "#00ffff";
        }

        else{

            const radius =
                20 + Math.random()*20;

            const theta =
                Math.random()*Math.PI*2;

            const phi =
                Math.acos(2*Math.random()-1);

            x =
                radius *
                Math.sin(phi) *
                Math.cos(theta);

            y =
                radius *
                Math.sin(phi) *
                Math.sin(theta);

            z =
                radius *
                Math.cos(phi);

            r = 0.1;
            g = 0.6;
            b = 1;

            s = 0.7;

            bloomPass.strength = 1.5;

            modeText.innerText =
                "SPECIAL POLICE DEKARANGER";

            modeText.style.color =
                "#00d9ff";
        }

        targetPos[i*3] = x;
        targetPos[i*3+1] = y;
        targetPos[i*3+2] = z;

        targetCol[i*3] = r;
        targetCol[i*3+1] = g;
        targetCol[i*3+2] = b;

        targetSize[i] = s;
    }
}

setTargets("idle");


// ---------------- HAND TRACKING ----------------

const videoElement =
    document.querySelector(".input_video");

const canvasElement =
    document.getElementById("output_canvas");

const canvasCtx =
    canvasElement.getContext("2d");

const hands = new Hands({
    locateFile:(file)=>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands:2,
    modelComplexity:1,
    minDetectionConfidence:0.7
});

hands.onResults((results)=>{

    canvasCtx.clearRect(
        0,
        0,
        canvasElement.width,
        canvasElement.height
    );

    let detected = "idle";

    if(results.multiHandLandmarks){

        results.multiHandLandmarks.forEach((lm)=>{

            drawConnectors(
                canvasCtx,
                lm,
                HAND_CONNECTIONS,
                {
                    color:"#00ffff",
                    lineWidth:4
                }
            );

            drawLandmarks(
                canvasCtx,
                lm,
                {
                    color:"#ffffff",
                    radius:2
                }
            );

            const isUp = (t,p)=>
                lm[t].y < lm[p].y;

            const pinch = Math.hypot(
                lm[8].x - lm[4].x,
                lm[8].y - lm[4].y
            );

            if(
                isUp(8,6) &&
                !isUp(12,10)
            ){

                detected = "red";
            }

            else if(
                isUp(8,6) &&
                isUp(12,10) &&
                !isUp(16,14)
            ){

                detected = "blue";
            }

            else if(
                isUp(8,6) &&
                isUp(12,10) &&
                isUp(16,14) &&
                isUp(20,18)
            ){

                detected = "shadow";
            }

            else if(pinch < 0.04){

                detected = "mega";
            }
        });
    }

    if(detected !== currentMode){

        setTargets(detected);
    }
});

const cameraUtils = new Camera(videoElement,{

    onFrame:async()=>{

        canvasElement.width =
            videoElement.videoWidth;

        canvasElement.height =
            videoElement.videoHeight;

        await hands.send({
            image:videoElement
        });
    },

    width:640,
    height:480
});

cameraUtils.start();


// ---------------- ENERGY RINGS ----------------

function createRing(color){

    const geo =
        new THREE.RingGeometry(5,5.5,64);

    const mat =
        new THREE.MeshBasicMaterial({

            color,

            transparent:true,

            opacity:1,

            side:THREE.DoubleSide
        });

    const ring =
        new THREE.Mesh(geo,mat);

    scene.add(ring);

    let scale = 1;

    function anim(){

        scale += 0.1;

        ring.scale.set(scale,scale,scale);

        mat.opacity *= 0.95;

        if(mat.opacity > 0.02){

            requestAnimationFrame(anim);

        }else{

            scene.remove(ring);
        }
    }

    anim();
}


// ---------------- ANIMATE ----------------

function animate(){

    requestAnimationFrame(animate);

    particleMaterial.uniforms.time.value += 0.03;

    const pos =
        geometry.attributes.position.array;

    const col =
        geometry.attributes.color.array;

    const siz =
        geometry.attributes.size.array;

    for(let i=0;i<COUNT*3;i++){

        pos[i] +=
            (targetPos[i] - pos[i]) * 0.08;

        col[i] +=
            (targetCol[i] - col[i]) * 0.08;
    }

    for(let i=0;i<COUNT;i++){

        siz[i] +=
            (targetSize[i] - siz[i]) * 0.08;
    }

    geometry.attributes.position.needsUpdate = true;
    geometry.attributes.color.needsUpdate = true;
    geometry.attributes.size.needsUpdate = true;

    if(currentMode === "red"){

        particles.rotation.z -= 0.03;

        if(Math.random() > 0.97){

            createRing(0xff0000);
        }
    }

    else if(currentMode === "blue"){

        particles.rotation.y += 0.01;

        if(Math.random() > 0.97){

            createRing(0x00aaff);
        }
    }

    else if(currentMode === "shadow"){

        renderer.domElement.style.transform =
            `translate(
                ${(Math.random()-0.5)*8}px,
                ${(Math.random()-0.5)*8}px
            )`;

        if(Math.random() > 0.95){

            createRing(0xffffff);
        }
    }

    else if(currentMode === "mega"){

        particles.rotation.y += 0.05;
        particles.rotation.z += 0.05;

        camera.position.z =
            42 + Math.sin(Date.now()*0.002)*5;

        if(Math.random() > 0.9){

            createRing(0x00ffff);
        }
    }

    else{

        renderer.domElement.style.transform =
            "translate(0,0)";

        particles.rotation.y += 0.002;
    }

    composer.render();
}

animate();


// ---------------- RESIZE ----------------

window.addEventListener("resize",()=>{

    camera.aspect =
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    composer.setSize(
        innerWidth,
        innerHeight
    );
});

</script>

</body>
</html>
